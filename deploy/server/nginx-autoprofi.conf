# nginx перед сайтом. __SITE_HOST__ подставляет setup.sh.
# http: только выдача сертификата Let's Encrypt, всё остальное — на https.
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Запись для nginx 1.24 из Ubuntu 24.04 (форма «http2 on» появилась в 1.25)
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/autoprofi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autoprofi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_tokens off;

    # Прямые ценовые отчёты — до 25 МБ (app/price_upload.py), с запасом
    client_max_body_size 40m;

    # Сжатие делает само приложение (GZipMiddleware) — здесь не дублируем.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host __SITE_HOST__;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Тяжёлые загрузки отчётов и дерево РНП могут считаться долго
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
